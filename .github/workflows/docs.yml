# SPDX-License-Identifier: Apache-2.0
name: documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation tools
        run: python -m pip install -r requirements-docs.txt -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build browser lab
        run: python tools/build_web.py --docker
      - name: Build verified browser installer
        run: |
          npm ci --prefix tools/flasher --ignore-scripts --no-audit --no-fund
          npm test --prefix tools/flasher
          npm run build --prefix tools/flasher
      - name: Stage verified release firmware
        run: |
          python tools/build_flasher.py
          python -m unittest discover -s tests/host -p test_flasher.py
          node --check docs/javascripts/flasher.js
          node --test tools/test_flasher.mjs
      - name: Compare browser and native behavior
        run: |
          cmake -S . -B build-host-web -G Ninja -DSNIFFER_HOST=ON -DSNIFFER_SANITIZE=OFF -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-host-web --target simulator_worker --parallel 2
          node tools/test_web.mjs
      - name: Check documentation sources
        run: |
          python tools/docs_assets.py --check
          python tools/check_docs.py
      - name: Build the site
        run: zensical build --clean --strict
      - name: Check generated links and assets
        run: |
          python tools/check_docs.py --site site
          python tools/build_flasher.py --check --output site/firmware
      - uses: actions/upload-artifact@v4
        with:
          name: hound-docs
          path: site/
          if-no-files-found: error
          retention-days: 14

  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hound-docs
          path: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish documentation and lab
        id: deployment
        uses: actions/deploy-pages@v4
